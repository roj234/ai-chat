<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>AiChat伴侣</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; width: 320px; margin: 0; padding: 12px; font-size: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .origin-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  .origin-item .url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { padding: 4px 10px; border: 1px solid #bbb; border-radius: 4px; background: #f0f0f0; cursor: pointer; font-size: 13px; }
  .muted { color: #888; font-size: 12px; }
  a { color: #2563eb; font-size: 13px; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>
  <h1>AiChat伴侣</h1>
  <div class="row">
    <label><input type="checkbox" id="global-enabled" /> 启用</label>
  </div>
  <div id="origins"></div>
  <div class="row"><button id="add-current">添加当前标签页</button></div>
  <div class="row"><a id="open-options">设置</a></div>
  <div id="status" class="muted"></div>
  <script src="popup.js"></script>
</body>
</html>
